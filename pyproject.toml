[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "extractor-partituras-youtube"
version = "2.4.2"
description = "Extractor modular de partituras con seguimiento, selección manual y reconstrucción horizontal desde YouTube y videos locales."
requires-python = ">=3.10,<3.15"

[tool.pytest.ini_options]
pythonpath = ["."]
